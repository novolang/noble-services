# The part of the profile configs/earbud_chip.toml of orbit/ble that this package and the Host it runs over read, for the tests of
# this package (`novo test --config configs/earbud_chip.toml`).  orbit/ble/configs/earbud_chip.toml holds the same sections;
# tests/orbit/test_ble_config_equals_limits.sh holds the two to each other.

[noble]
max_connections = 2
max_prepared_bytes = 256
max_client_links = 0
client_bearers = 0
client_cache_records = 0
client_queue = 0
client_value_bytes = 0
max_bcast_sources = 0
max_unicast_streams = 2
max_bcast_sinks = 2
